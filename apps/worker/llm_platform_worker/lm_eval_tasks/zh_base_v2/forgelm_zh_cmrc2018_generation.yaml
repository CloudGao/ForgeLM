task: forgelm_zh_cmrc2018_generation
dataset_path: clue/clue
dataset_name: cmrc2018
validation_split: validation
output_type: generate_until
doc_to_text: !function utils.cmrc2018_prompt
doc_to_target: !function utils.first_cmrc2018_answer
process_results: !function utils.process_cmrc2018_results
generation_kwargs:
  do_sample: false
  temperature: 0.0
  until:
    - "\n"
  max_gen_toks: 64
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: char_f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
