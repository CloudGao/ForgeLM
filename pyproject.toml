[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-llm-platform"
version = "0.1.0"
description = "Local-first LLM lifecycle control plane and worker agent"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "duckdb>=1.3,<2",
  "fastapi>=0.115,<1",
  "huggingface-hub>=1.2,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "nvidia-ml-py>=12,<14",
  "psutil>=6.1,<8",
  "paramiko>=3.5,<5",
  "pypdf>=6,<7",
  "pydantic-settings>=2.7,<3",
  "pyarrow>=18,<26",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "tokenizers>=0.19,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
data-juicer = [
  "py-data-juicer>=1.5.5,<1.6",
  "ray>=2.30,<3",
  "scipy>=1.11,<2",
]
inference-hf = [
  "requests>=2.32,<3",
  "sympy>=1.13,<2",
  "torch>=2.2,<3",
  "transformers>=4.45,<6",
]
benchmark-hf = [
  "lm_eval[api,hf,ifeval,longbench]>=0.4.12,<1",
]
benchmark-vllm = [
  "lm_eval[api,ifeval,longbench,vllm]>=0.4.12,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
llm-platform-api = "llm_platform.main:run"
llm-platform-supervisor = "llm_platform.supervisor:run"
llm-platform-worker = "llm_platform_worker.main:run"
forgelm-plugin = "forgelm_plugin_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/llm_platform",
  "apps/worker/llm_platform_worker",
  "packages/llm_platform_core",
  "packages/forgelm_plugin_sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/worker", "packages"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
